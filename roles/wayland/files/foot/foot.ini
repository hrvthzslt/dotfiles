font=Hack Nerd Font:size=12
font-size-adjustment=2
initial-window-size-pixels=700x500
pad=14x14 center

initial-color-theme=light

[environment]
# TERM=xterm-256color

[cursor]
style=block
blink=no

[colors-dark]

[colors-light]
# alpha=0.97
background=F0EDEC
foreground=2C363C

cursor=F0EDEC 2C363C

regular0=F0EDEC  # black
regular1=A8334C  # red
regular2=4F6C31  # green
regular3=944927  # yellow
regular4=286486  # blue
regular5=88507D  # magenta
regular6=3B8992  # cyan
regular7=2C363C  # white

bright0=CFC1BA   # bright black
bright1=94253E   # bright red
bright2=3F5A22   # bright green
bright3=803D1C   # bright yellow
bright4=1D5573   # bright blue
bright5=7B3B70   # bright magenta
bright6=2B747C   # bright cyan
bright7=4F5E68   # bright white

[key-bindings]
font-increase=Control+period
font-decrease=Control+minus
font-reset=Control+comma
